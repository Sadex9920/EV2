{% extends 'base.html' %}

{% block title %}{{ accion }} Peleador - UFC{% endblock %}

{% block content %}
<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card bg-black border-danger border-2 shadow-lg p-4">
        <h3 class="text-white text-uppercase fw-bold border-bottom border-danger pb-3 mb-4">
            {{ accion }} Peleador
        </h3>
        <form method="POST" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-danger fw-bold text-uppercase">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-warning small fw-bold mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'ufc_peleadores' %}" class="btn btn-secondary fw-bold text-uppercase">Cancelar</a>
                <button type="submit" class="btn btn-danger fw-bold text-uppercase px-4">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
