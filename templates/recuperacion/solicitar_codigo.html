{% extends 'base.html' %}
{% block title %}Recuperar Contraseña - SportCenter{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card bg-black border-danger border-2 shadow-lg p-5" style="width: 100%; max-width: 500px;">
        <div class="text-center mb-4 border-bottom border-danger pb-3">
            <h3 class="text-white text-uppercase fw-bold m-0">Recuperar Cuenta</h3>
            <p class="text-danger fw-bold mt-2">Paso 1: Identificación</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger fw-bold text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-white fw-bold">CORREO ELECTRÓNICO REGISTRADO</label>
                <input type="email" name="email" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="d-grid gap-3 mt-4">
                <button type="submit" class="btn btn-danger btn-lg fw-bold text-uppercase shadow">Enviar Código</button>
                <a href="{% url 'login_raiz' %}" class="btn btn-outline-light btn-lg fw-bold text-uppercase">Volver al Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
