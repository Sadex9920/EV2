{% extends 'base.html' %}
{% block title %}Nueva Contraseña - SportCenter{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card bg-black border-success border-2 shadow-lg p-5" style="width: 100%; max-width: 500px;">
        <div class="text-center mb-4 border-bottom border-success pb-3">
            <h3 class="text-white text-uppercase fw-bold m-0">Nueva Contraseña</h3>
            <p class="text-success fw-bold mt-2">Paso 3: Actualización</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger fw-bold text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-white fw-bold">NUEVA CONTRASEÑA</label>
                <input type="password" name="pass1" class="form-control form-control-lg bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-white fw-bold">CONFIRMAR CONTRASEÑA</label>
                <input type="password" name="pass2" class="form-control form-control-lg bg-dark text-white border-secondary" required>
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg fw-bold text-white text-uppercase shadow">Guardar y Entrar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
