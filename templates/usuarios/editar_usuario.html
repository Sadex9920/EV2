{% extends 'base.html' %}
{% block title %}Editar Usuario - SportCenter{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card bg-black border-warning border-2 shadow-lg p-5" style="width: 100%; max-width: 650px;">
        
        <div class="text-center mb-4 border-bottom border-warning pb-3">
            <h3 class="text-white text-uppercase fw-bold m-0">Editar Usuario</h3>
            <p class="text-warning fw-bold mt-2">Modificando a: {{ usuario_edit.username }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-white fw-bold">Nombres</label>
                <input type="text" name="first_name" class="form-control bg-dark text-white border-secondary" value="{{ usuario_edit.first_name }}">
            </div>
            
            <div class="mb-3">
                <label class="form-label text-white fw-bold">Apellidos</label>
                <input type="text" name="last_name" class="form-control bg-dark text-white border-secondary" value="{{ usuario_edit.last_name }}">
            </div>
            
            <div class="mb-3">
                <label class="form-label text-white fw-bold">Correo Electrónico</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" value="{{ usuario_edit.email }}">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-white fw-bold">Perfil Asignado</label>
                <select name="grupo" class="form-select bg-dark text-white border-secondary">
                    <option value="">-- Sin Perfil --</option>
                    {% for grupo in grupos %}
                        <option value="{{ grupo.id }}" {% if grupo_actual and grupo_actual.id == grupo.id %}selected{% endif %}>
                            {{ grupo.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-grid gap-3 mt-5">
                <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark text-uppercase shadow">Actualizar Usuario</button>
                <a href="{% url 'listar_usuarios' %}" class="btn btn-outline-light btn-lg fw-bold text-uppercase">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
